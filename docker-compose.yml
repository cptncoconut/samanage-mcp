# WARNING: No authentication on the HTTP endpoint. Restrict access with
# a reverse proxy before exposing beyond your local machine.
# Copy .env.example to .env and fill in SAMANAGE_API_TOKEN before running.
services:
  samanage-mcp:
    build: .
    container_name: samanage-mcp
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 8765
    ports:
      - "127.0.0.1:8765:8765"
